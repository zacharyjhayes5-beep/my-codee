name = "gis-ingest"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The stable workers.dev route is the only public surface. Preview URLs would
# publish every uploaded version at its own address, which is more exposure
# than a homeowner-data API should carry.
workers_dev = true
preview_urls = false

# The D1 binding. `database_id` is filled in after the database is created —
# `wrangler d1 create gis_leads` prints it. It is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "gis_leads"
database_id = "a2cf8737-159f-4cd7-8c1d-198a4ef3b071"

# Sheet mirror secrets, set with `wrangler secret put` — never values here:
#   SHEETS_WEBHOOK_URL     the Apps Script Web App URL
#   SHEETS_WEBHOOK_SECRET  the password set in the script's Script Properties
# Until both are set the mirror is a no-op and GIS ingestion is unaffected.

[vars]
# Production batch: 25 per weekday run, quota'd 9 Ada / 8 Cascade / 8 East
# Grand Rapids, with any shortfall filled from the other two.
BATCH_MODE = "full"

# Every day at 11:00 UTC — 7am Eastern in summer, 6am in winter. The batch is
# waiting before the working day starts either way.
[triggers]
crons = ["0 11 * * *"]
