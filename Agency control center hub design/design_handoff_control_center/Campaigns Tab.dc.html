            <text x="360" y="124" text-anchor="middle" fill="#8f8b84" font-size="9.5" letter-spacing="1.6">{{ cMailing }}</text>
          </g>
          <g onClick="{{ pickCold }}" style="cursor: pointer;">
            <circle cx="609" cy="279" r="94" fill="url(#g2)" opacity="{{ selCold }}"></circle>
            <circle cx="609" cy="279" r="66" fill="url(#nodeFill)" stroke="#b0803e" stroke-opacity="0.45"></circle>
            <circle cx="609" cy="279" r="66" fill="none" stroke="#b0803e" stroke-opacity="0.95" opacity="{{ selCold }}"></circle>
            <circle cx="609" cy="279" r="73" fill="none" stroke="#b0803e" stroke-opacity="0.3" opacity="{{ selCold }}"></circle>
            <text x="609" y="257" text-anchor="middle" fill="#b0803e" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" letter-spacing="1.6">II</text>
            <text x="609" y="283" text-anchor="middle" fill="#f1efe9" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" letter-spacing="0.6">Cold Calls</text>

          <g onClick="{{ pickCommunity }}" style="cursor: pointer;">
            <circle cx="514" cy="572" r="94" fill="url(#g3)" opacity="{{ selCommunity }}"></circle>
            <circle cx="514" cy="572" r="66" fill="url(#nodeFill)" stroke="#9c5a48" stroke-opacity="0.45"></circle>
            <circle cx="514" cy="572" r="66" fill="none" stroke="#9c5a48" stroke-opacity="0.95" opacity="{{ selCommunity }}"></circle>
            <circle cx="514" cy="572" r="73" fill="none" stroke="#9c5a48" stroke-opacity="0.3" opacity="{{ selCommunity }}"></circle>
            <text x="514" y="550" text-anchor="middle" fill="#9c5a48" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" letter-spacing="1.6">III</text>
            <text x="514" y="576" text-anchor="middle" fill="#f1efe9" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" letter-spacing="0.6">Community</text>
            <text x="514" y="598" text-anchor="middle" fill="#8f8b84" font-size="9.5" letter-spacing="1.6">{{ cCommunity }}</text>
          </g>
          <g onClick="{{ pickSocial }}" style="cursor: pointer;">
            <circle cx="206" cy="572" r="94" fill="url(#g4)" opacity="{{ selSocial }}"></circle>
            <circle cx="206" cy="572" r="66" fill="url(#nodeFill)" stroke="#4f7f75" stroke-opacity="0.45"></circle>
            <circle cx="206" cy="572" r="66" fill="none" stroke="#4f7f75" stroke-opacity="0.95" opacity="{{ selSocial }}"></circle>
            <circle cx="206" cy="572" r="73" fill="none" stroke="#4f7f75" stroke-opacity="0.3" opacity="{{ selSocial }}"></circle>
            <text x="206" y="550" text-anchor="middle" fill="#4f7f75" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" letter-spacing="1.6">IV</text>
            <text x="206" y="576" text-anchor="middle" fill="#f1efe9" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" letter-spacing="0.6">Social Media</text>
            <text x="206" y="598" text-anchor="middle" fill="#8f8b84" font-size="9.5" letter-spacing="1.6">{{ cSocial }}</text>
          </g>
          <g onClick="{{ pickReferrals }}" style="cursor: pointer;">
            <circle cx="111" cy="279" r="94" fill="url(#g5)" opacity="{{ selReferrals }}"></circle>
            <circle cx="111" cy="279" r="66" fill="url(#nodeFill)" stroke="#c9a86a" stroke-opacity="0.45"></circle>
            <circle cx="111" cy="279" r="66" fill="none" stroke="#c9a86a" stroke-opacity="0.95" opacity="{{ selReferrals }}"></circle>
            <circle cx="111" cy="279" r="73" fill="none" stroke="#c9a86a" stroke-opacity="0.3" opacity="{{ selReferrals }}"></circle>
            <text x="111" y="257" text-anchor="middle" fill="#c9a86a" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" letter-spacing="1.6">V</text>
            <text x="111" y="283" text-anchor="middle" fill="#f1efe9" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" letter-spacing="0.6">Referrals</text>
            <text x="111" y="305" text-anchor="middle" fill="#8f8b84" font-size="9.5" letter-spacing="1.6">{{ cReferrals }}</text>
          </g>

          <circle cx="360" cy="360" r="112" fill="none" stroke="#c9a86a" stroke-opacity="0.14"></circle>
          <circle cx="360" cy="360" r="100" fill="url(#hubFill)" stroke="#c9a86a" stroke-opacity="0.55"></circle>
          <circle cx="360" cy="360" r="92" fill="none" stroke="#c9a86a" stroke-opacity="0.22"></circle>
          <text x="360" y="345" text-anchor="middle" fill="#f6f2ea" font-family="'Cormorant Garamond', Georgia, serif" font-size="27" letter-spacing="1">Campaigns</text>
          <line x1="322" y1="360" x2="398" y2="360" stroke="#c9a86a" stroke-opacity="0.4"></line>
          <text x="360" y="380" text-anchor="middle" fill="#8f8b84" font-size="9" letter-spacing="2.6">FIVE CHANNELS</text>
          <text x="360" y="400" text-anchor="middle" fill="#dfc9a1" font-size="10.5" letter-spacing="1.4">{{ total }}</text>
        </svg>
      </div>
    </section>

    <aside style="display: flex; flex-direction: column; gap: 14px; min-width: 0;">
      <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid rgba(201,168,106,.2); background: linear-gradient(180deg, rgba(28,26,33,.6), rgba(14,13,17,.72)); box-shadow: var(--shadow-md), inset 0 1px 0 rgba(233,233,237,.04);">
        <span style="position: absolute; left: -1px; top: -1px; width: 14px; height: 14px; border-left: 1px solid rgba(201,168,106,.75); border-top: 1px solid rgba(201,168,106,.75);"></span>
        <span style="position: absolute; right: -1px; bottom: -1px; width: 14px; height: 14px; border-right: 1px solid rgba(201,168,106,.75); border-bottom: 1px solid rgba(201,168,106,.75);"></span>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ hue }};"></span>
            <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--color-accent-300);">Log entry</span>
          </div>
          <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25px; font-weight: 400; letter-spacing: .03em;">{{ node.name }}</span>
          <span style="font-size: 12px; color: var(--color-neutral-500); text-wrap: pretty;">{{ node.hint }}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
            <label style="display: flex; flex-direction: column; gap: 6px;">
              <span style="font-family: var(--font-body); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-500);">{{ f.label }}</span>
              <sc-if value="{{ f.multiline }}" hint-placeholder-val="{{ true }}">
                <textarea rows="3" placeholder="{{ f.placeholder }}" value="{{ f.value }}" onChange="{{ f.onChange }}" style="width: 100%; box-sizing: border-box; background: rgba(10,9,13,.6); color: var(--color-text); border: 1px solid rgba(201,168,106,.18); border-radius: 2px; padding: 9px 11px; font-family: var(--font-body); font-size: 13px; outline: none; resize: vertical; line-height: 1.5;" style-focus="border-color: var(--color-accent-500);"></textarea>
              </sc-if>
              <sc-if value="{{ f.single }}" hint-placeholder-val="{{ true }}">
                <input type="text" placeholder="{{ f.placeholder }}" value="{{ f.value }}" onChange="{{ f.onChange }}" style="width: 100%; box-sizing: border-box; background: rgba(10,9,13,.6); color: var(--color-text); border: 1px solid rgba(201,168,106,.18); border-radius: 2px; padding: 9px 11px; font-family: var(--font-body); font-size: 13px; outline: none;" style-focus="border-color: var(--color-accent-500);"></input>
              </sc-if>
            </label>
          </sc-for>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn btn-primary" style="font-size: 12px; padding: 7px 12px; flex: 1;" onClick="{{ save }}">Save entry</button>
          <button class="btn btn-ghost" style="font-size: 12px; padding: 7px 12px;" onClick="{{ clear }}">Clear</button>
        </div>
      </div>

      <div style="position: relative; display: flex; flex-direction: column; gap: 4px; min-height: 0; padding: 18px; border: 1px solid rgba(201,168,106,.14); background: linear-gradient(180deg, rgba(26,24,30,.5), rgba(13,12,16,.66));">
        <span style="position: absolute; left: -1px; top: -1px; width: 14px; height: 14px; border-left: 1px solid rgba(201,168,106,.5); border-top: 1px solid rgba(201,168,106,.5);"></span>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 6px;">
          <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--color-accent-300);">Recent entries</span>
          <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: .1em; color: var(--color-neutral-500);">{{ node.count }}</span>
        </div>
        <sc-for list="{{ entries }}" as="e" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-top: 1px solid var(--color-divider);">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
              <span style="font-size: 13px; color: var(--color-text);">{{ e.title }}</span>
              <span style="font-family: var(--font-body); font-size: 10px; color: var(--color-neutral-600); white-space: nowrap;">{{ e.date }}</span>
            </div>
            <span style="font-size: 12px; color: var(--color-neutral-500); text-wrap: pretty;">{{ e.sub }}</span>
          </div>
        </sc-for>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; color: var(--color-neutral-600); padding: 10px 0; border-top: 1px solid var(--color-divider);">Nothing logged for this channel yet.</span>
        </sc-if>
      </div>
    </aside>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const CH = {
  Mailing: {
    name: 'Mailing',
    hint: 'Log each drop as it goes out, plus whatever you want to remember about it.',
    fields: [
      { key: 'campaign', label: 'Campaign', placeholder: 'e.g. Q3 renewal postcard' },
      { key: 'date', label: 'Date sent', placeholder: 'Aug 23' },
      { key: 'notes', label: 'Notes', placeholder: 'List used, piece, count, anything worth remembering', multiline: true }
    ],
    title: e => e.campaign || 'Untitled drop',
    sub: e => e.notes
  },
  'Cold Calls': {
    name: 'Cold Calls',
    hint: 'Log your call volume for the day.',
    fields: [
      { key: 'date', label: 'Date', placeholder: 'Aug 23' },
      { key: 'volume', label: 'Calls made', placeholder: 'e.g. 64' },
      { key: 'notes', label: 'Notes', placeholder: 'Optional — list, block, anything notable', multiline: true }
    ],
    title: e => (e.volume ? e.volume + ' calls' : 'Calls'),
    sub: e => e.notes
  },
  Community: {
    name: 'Community',
    hint: 'Write down what you did — event, sponsorship, drop-in.',
    fields: [
      { key: 'date', label: 'Date', placeholder: 'Aug 23' },
      { key: 'notes', label: 'What you did', placeholder: 'Describe it', multiline: true }
    ],
    title: e => (e.notes || '').split('\n')[0].slice(0, 60) || 'Entry',
    sub: e => ''
  },
  'Social Media': {
    name: 'Social Media',
    hint: 'Write down what you posted or ran.',
    fields: [
      { key: 'date', label: 'Date', placeholder: 'Aug 23' },
      { key: 'notes', label: 'What you posted', placeholder: 'Describe it', multiline: true }
    ],
    title: e => (e.notes || '').split('\n')[0].slice(0, 60) || 'Entry',
    sub: e => ''
  },
  Referrals: {
    name: 'Referrals',
    hint: 'Log who sent the referral and who they sent.',
    fields: [
      { key: 'source', label: 'Referred by', placeholder: 'e.g. Dave Kowalski' },
      { key: 'people', label: 'Referred', placeholder: 'Names, separated by commas' },
      { key: 'date', label: 'Date', placeholder: 'Aug 23' },
      { key: 'notes', label: 'Notes', placeholder: 'Optional', multiline: true }
    ],
    title: e => e.source || 'Referral',
    sub: e => (e.people ? '→ ' + e.people : '')
  }
};

const SEED = {
  Mailing: [
    { campaign: 'Homeowner renewal postcard', date: 'Aug 18', notes: '1,200 pieces, owned list, bundle offer on the back.' }
  ],
  'Cold Calls': [
    { date: 'Aug 22', volume: '64', notes: 'Small-business block, 6 quotes set.' }
  ],
  Community: [
    { date: 'Aug 16', notes: 'Sponsored the little league end-of-season cookout, handed out 40 folders.' }
  ],
  'Social Media': [
    { date: 'Aug 20', notes: 'Posted the auto-bundle explainer video to the page and two local groups.' }
  ],
  Referrals: [
    { source: 'Dave Kowalski', people: 'Marcy Hall, Ted Hall', date: 'Aug 19', notes: '' }
  ]
};

const ORDER = ['Mailing', 'Cold Calls', 'Community', 'Social Media', 'Referrals'];
const HUE = { Mailing: '#4d8ef8', 'Cold Calls': '#f2a33c', Community: '#f4694c', 'Social Media': '#35bdf2', Referrals: '#f5c745' };

class Component extends DCLogic {
  state = { sel: 'Mailing', entries: SEED, draft: {} };

  pick(name) { return () => this.setState({ sel: name }); }

  setField(key) {
    return (ev) => {
      const v = ev.target.value;
      this.setState(st => ({ draft: Object.assign({}, st.draft, { [key]: v }) }));
    };
  }

  save = () => {
    this.setState(st => {
      const ch = CH[st.sel];
      const d = st.draft;
      const filled = ch.fields.some(f => (d[f.key] || '').trim());
      if (!filled) return null;
      const list = [Object.assign({}, d)].concat(st.entries[st.sel] || []);
      return { entries: Object.assign({}, st.entries, { [st.sel]: list }), draft: {} };
    });
  };

  clear = () => this.setState({ draft: {} });

  renderVals() {
    const sel = this.state.sel;
    const ch = CH[sel];
    const d = this.state.draft;
    const list = this.state.entries[sel] || [];
    const n = k => {
      const c = (this.state.entries[k] || []).length;
      return c + (c === 1 ? ' entry' : ' entries');
    };
    const total = ORDER.reduce((a, k) => a + (this.state.entries[k] || []).length, 0);
    return {
      node: { name: ch.name, hint: ch.hint, count: n(sel) },
      hue: HUE[sel],
      fields: ch.fields.map(f => ({
        label: f.label,
        placeholder: f.placeholder,
        value: d[f.key] || '',
        onChange: this.setField(f.key),
        multiline: !!f.multiline,
        single: !f.multiline
      })),
      entries: list.map(e => ({ title: ch.title(e), sub: ch.sub(e), date: e.date || '' })),
      isEmpty: list.length === 0,
      save: this.save,
      clear: this.clear,
      total: total + (total === 1 ? ' entry' : ' entries'),
      cMailing: n('Mailing'),
      cCold: n('Cold Calls'),
      cCommunity: n('Community'),
      cSocial: n('Social Media'),
      cReferrals: n('Referrals'),
      selMailing: sel === 'Mailing' ? 1 : 0,
      selCold: sel === 'Cold Calls' ? 1 : 0,
      selCommunity: sel === 'Community' ? 1 : 0,
      selSocial: sel === 'Social Media' ? 1 : 0,
      selReferrals: sel === 'Referrals' ? 1 : 0,
      pickMailing: this.pick('Mailing'),
      pickCold: this.pick('Cold Calls'),
      pickCommunity: this.pick('Community'),
      pickSocial: this.pick('Social Media'),
      pickReferrals: this.pick('Referrals')
    };
  }
}
</script>
</body>
</html>
